# One command to run the whole workspace:
#
#     docker compose up --build
#
# Then open http://localhost:8000
#
# Keys are optional — see .env.example. Without them the workspace still
# searches free academic databases, reads documents, runs statistics, draws
# charts and formats citations; it answers by quoting sources rather than
# writing prose, and says so.

services:
  lumen:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumen-research-workspace:latest
    container_name: lumen
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # The UI is served from this same origin, so no cross-origin config needed.
      CORS_ORIGINS: "http://localhost:${PORT:-8000},http://127.0.0.1:${PORT:-8000}"
      ENVIRONMENT: production
      DATA_DIR: /data
      # Everything below is read from .env if present, and is optional.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      SEARXNG_BASE_URL: "${SEARXNG_BASE_URL:-}"
      SEMANTICSCHOLAR_API_KEY: "${SEMANTICSCHOLAR_API_KEY:-}"
      # Sent to polite-pool APIs (OpenAlex, Crossref) so they can contact you.
      CONTACT_EMAIL: "${CONTACT_EMAIL:-research-workspace@example.org}"
      RESPECT_ROBOTS_TXT: "${RESPECT_ROBOTS_TXT:-true}"
    volumes:
      # Uploads, the SQLite database and generated artifacts survive a rebuild.
      - lumen-data:/data
    restart: unless-stopped

volumes:
  lumen-data:
